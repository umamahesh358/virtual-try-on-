<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry Virtual Try-On</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Mirror the video feed if it's the front camera */
            transform: scaleX(-1);
        }
        .canvas-overlay {
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center mb-6 text-purple-700">Jewelry Virtual Try-On</h1>

        <div class="flex flex-col md:flex-row gap-6">
            <!-- Left Panel: VTO View -->
            <div class="flex-1 bg-white p-4 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">Live Try-On</h2>
                    <button id="switchCameraBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded hidden text-sm">Switch Camera</button>
                </div>

                <div class="video-container bg-black rounded-lg overflow-hidden aspect-[3/4] md:aspect-video" id="videoContainer">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="output_canvas" class="canvas-overlay"></canvas>
                </div>

                <div class="mt-4 flex flex-col gap-2">
                    <p id="statusMsg" class="text-sm text-gray-600">Initializing camera...</p>
                    <div id="calibrationControls" class="hidden p-2 bg-gray-50 rounded border flex flex-wrap gap-2 items-center justify-center">
                        <span class="text-xs font-semibold w-full text-center">Manual Calibration</span>
                        <button onclick="calibrate('up')" class="px-2 py-1 bg-gray-200 rounded text-xs">↑</button>
                        <button onclick="calibrate('down')" class="px-2 py-1 bg-gray-200 rounded text-xs">↓</button>
                        <button onclick="calibrate('left')" class="px-2 py-1 bg-gray-200 rounded text-xs">←</button>
                        <button onclick="calibrate('right')" class="px-2 py-1 bg-gray-200 rounded text-xs">→</button>
                        <button onclick="calibrate('scaleUp')" class="px-2 py-1 bg-gray-200 rounded text-xs">+</button>
                        <button onclick="calibrate('scaleDown')" class="px-2 py-1 bg-gray-200 rounded text-xs">-</button>
                        <button onclick="resetCalibration()" class="px-2 py-1 bg-red-200 rounded text-xs">Reset</button>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Controls & Catalog -->
            <div class="w-full md:w-1/3 bg-white p-4 rounded-lg shadow-md flex flex-col gap-6">
                <!-- Admin Upload Section -->
                <div>
                    <h2 class="text-xl font-semibold mb-2">Upload Product</h2>
                    <form id="uploadForm" class="flex flex-col gap-3">
                        <select id="categorySelect" name="category" class="border p-2 rounded" required>
                            <option value="">Select Category...</option>
                            <option value="Rings">Ring</option>
                            <option value="Bangles">Bangle</option>
                            <option value="Earrings">Earrings</option>
                            <option value="Necklaces">Necklace</option>
                            <option value="Chokers">Choker</option>
                            <option value="Nose Rings">Nose Ring</option>
                            <option value="Maang Tikka">Maang Tikka</option>
                            <option value="Waist Jewelry">Waist Jewelry</option>
                        </select>
                        <div class="text-sm">
                            <label class="block">Front View</label>
                            <input type="file" name="front" accept="image/*" class="w-full text-xs">
                        </div>
                        <div class="text-sm">
                            <label class="block">Back View (Optional)</label>
                            <input type="file" name="back" accept="image/*" class="w-full text-xs">
                        </div>
                        <div class="text-sm">
                            <label class="block">Left View (Optional)</label>
                            <input type="file" name="left" accept="image/*" class="w-full text-xs">
                        </div>
                        <div class="text-sm">
                            <label class="block">Right View (Optional)</label>
                            <input type="file" name="right" accept="image/*" class="w-full text-xs">
                        </div>
                        <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded">
                            Upload & Process
                        </button>
                    </form>
                    <p id="uploadStatus" class="text-sm mt-2 hidden"></p>
                </div>

                <hr>

                <!-- Catalog Section -->
                <div class="flex-1 overflow-y-auto">
                    <h2 class="text-xl font-semibold mb-2">Catalog</h2>
                    <div id="catalogList" class="flex flex-col gap-2">
                        <p class="text-sm text-gray-500">Loading catalog...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MediaPipe Vision Tasks CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
    <script src="/js/app.js"></script>
</body>
</html>
