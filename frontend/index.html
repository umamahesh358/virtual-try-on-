<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Try-On Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Default to mirrored for front camera */
            transform: scaleX(-1);
        }
        .canvas-overlay {
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto p-4 max-w-6xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-purple-700">Jewelry Try-On</h1>
            <a href="/admin" class="text-blue-600 hover:underline">Admin Panel &rarr;</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- Left Side: Catalog -->
            <div class="md:col-span-1 bg-white p-4 rounded-lg shadow-md h-fit max-h-[80vh] flex flex-col">
                <h2 class="text-xl font-semibold mb-4">Store Catalog</h2>
                <div id="catalogList" class="flex flex-col gap-3 overflow-y-auto pr-2">
                    <p class="text-sm text-gray-500">Loading catalog...</p>
                </div>
            </div>

            <!-- Right Side: VTO View -->
            <div class="md:col-span-2 bg-white p-4 rounded-lg shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">Live Camera</h2>
                    <button id="switchCameraBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded hidden text-sm">Flip Camera</button>
                </div>

                <div class="video-container bg-black rounded-lg overflow-hidden aspect-[3/4] md:aspect-video" id="videoContainer">
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="output_canvas" class="canvas-overlay"></canvas>
                </div>

                <div class="mt-4 flex flex-col gap-2">
                    <p id="statusMsg" class="text-sm font-semibold text-gray-600">Initializing camera...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- MediaPipe Vision Tasks CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
    <script src="/js/store.js"></script>
</body>
</html>
