<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Upload Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .preview-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            aspect-ratio: 3/4;
            background-color: #f3f4f6;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #ccc;
        }
        .dummy-face {
            width: 50%;
            opacity: 0.2;
            pointer-events: none;
        }
        #productPreview {
            position: absolute;
            transform-origin: center center;
            max-width: none;
            /* Default transform */
            transform: translate(0px, 0px) scale(1, 1);
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto p-4 max-w-6xl">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-purple-700">Admin Panel - Upload Product</h1>
            <a href="/" class="text-blue-600 hover:underline">Go to Try-On Store &rarr;</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Upload Form -->
            <div class="bg-white p-6 rounded-lg shadow-md h-fit">
                <h2 class="text-xl font-semibold mb-4">Step 1: Upload 2D Image</h2>
                <form id="uploadForm" class="flex flex-col gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Category</label>
                        <select id="categorySelect" name="category" class="w-full border p-2 rounded" required>
                            <option value="">Select Category...</option>
                            <option value="Rings">Ring</option>
                            <option value="Bangles">Bangle</option>
                            <option value="Earrings">Earrings</option>
                            <option value="Necklaces">Necklace</option>
                            <option value="Chokers">Choker</option>
                            <option value="Nose Rings">Nose Ring</option>
                            <option value="Maang Tikka">Maang Tikka</option>
                            <option value="Waist Jewelry">Waist Jewelry</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Product Image (with or without background)</label>
                        <input type="file" name="image" id="imageInput" accept="image/*" required class="w-full border p-2 rounded text-sm">
                        <p class="text-xs text-gray-500 mt-1">Background will be automatically removed.</p>
                    </div>

                    <button type="submit" id="uploadBtn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded transition">
                        Upload & Process
                    </button>
                    <p id="uploadStatus" class="text-sm font-semibold"></p>
                </form>
            </div>

            <!-- Adjustment Panel -->
            <div id="adjustmentPanel" class="bg-white p-6 rounded-lg shadow-md hidden">
                <h2 class="text-xl font-semibold mb-4">Step 2: Adjust Size & Position</h2>

                <div class="preview-container rounded mb-6" id="previewContainer">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Face-smile.svg/1200px-Face-smile.svg.png" class="dummy-face" alt="reference face">
                    <img id="productPreview" src="" alt="product preview">
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium">Width Scale: <span id="widthVal">1.0</span></label>
                        <input type="range" id="widthSlider" min="0.1" max="5.0" step="0.05" value="1.0" class="w-full">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Length Scale: <span id="lengthVal">1.0</span></label>
                        <input type="range" id="lengthSlider" min="0.1" max="5.0" step="0.05" value="1.0" class="w-full">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Offset X (Left/Right): <span id="xVal">0</span></label>
                        <input type="range" id="xSlider" min="-200" max="200" step="1" value="0" class="w-full">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Offset Y (Up/Down): <span id="yVal">0</span></label>
                        <input type="range" id="ySlider" min="-200" max="200" step="1" value="0" class="w-full">
                    </div>
                </div>

                <div class="flex gap-2">
                    <button id="saveMetaBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition">
                        Save Adjustments
                    </button>
                    <button id="resetMetaBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded transition">
                        Reset
                    </button>
                </div>
                <p id="saveStatus" class="text-sm font-semibold mt-2 text-green-600"></p>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
